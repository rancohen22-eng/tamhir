<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>תמחיר טיסות</title>
<style>
  :root{
    /* ערכת מותג */
    --bg:#f2f5f9; --card:#ffffff; --ink:#0e1c2e; --muted:#5b6b7f;
    --brand:#123a86; --brand2:#1e63b8; --accent:#0e7a4e; --line:#e2e8f0;
    --danger:#b3261e; --chip:#e8eff7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,"Heebo",Arial,sans-serif;
    font-size:16px; line-height:1.45;
  }
  .hidden{display:none !important}

  /* ── מסך נעילה ── */
  #lock{
    min-height:100dvh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:24px;
    background:linear-gradient(160deg,var(--brand) 0%,var(--brand2) 100%);
  }
  #lock .panel{
    width:100%; max-width:360px; background:var(--card); border-radius:16px;
    padding:28px 22px; box-shadow:0 10px 30px rgba(0,0,0,.25); text-align:center;
  }
  #lock h1{margin:6px 0 2px; font-size:18px; color:var(--brand); font-weight:600}
  #lock p{margin:0 0 18px; color:var(--muted); font-size:14px}
  #pw{
    width:100%; padding:12px 14px; font-size:17px; border:1px solid var(--line);
    border-radius:10px; text-align:center; direction:ltr;
  }
  #pw:focus{outline:2px solid var(--brand2); border-color:transparent}
  #unlockBtn{
    width:100%; margin-top:12px; padding:13px; font-size:17px; font-weight:600;
    color:#fff; background:var(--brand); border:0; border-radius:10px; cursor:pointer;
  }
  #unlockBtn:disabled{opacity:.6}
  #lockErr{color:var(--danger); font-size:14px; min-height:20px; margin-top:10px}

  /* ── מסך ראשי ── */
  header.app{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(160deg,var(--brand) 0%,var(--brand2) 100%);
    color:#fff; padding:12px 14px 10px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  header.app .title{display:flex; align-items:center; gap:9px}
  header.app h1{margin:0; font-size:17px}
  header.app .gen{font-size:11px; opacity:.75}
  header.app .syslink{
    margin-inline-start:auto; flex:0 0 auto; color:#fff; text-decoration:none;
    background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.42);
    font-size:12.5px; font-weight:600; padding:5px 9px; border-radius:8px; white-space:nowrap;
  }
  header.app .syslink:active{background:#fff; color:var(--brand)}
  .monthsrow{display:flex; align-items:center; gap:8px}
  .topctrl{display:flex; align-items:center; gap:6px; flex:0 0 auto}
  .seg-hdr{border:1px solid rgba(255,255,255,.4); border-radius:8px; overflow:hidden; display:inline-flex}
  .seg-hdr button{background:rgba(255,255,255,.16); color:#fff; border:0; padding:6px 10px; font-size:15px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center}
  .seg-hdr button svg{display:block}
  .seg-hdr button.sel{background:#fff; color:var(--brand); font-weight:700}
  .acfilter-hdr{background:#fff; color:var(--ink); border:0; border-radius:8px; padding:6px 8px; font-size:12.5px; max-width:150px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  /* בורר צי רב-ברירתי */
  .acmulti{position:relative}
  .acmenu{position:absolute; top:calc(100% + 5px); left:0; z-index:40; background:#fff; color:var(--ink);
    border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.22); min-width:200px; max-height:52dvh; overflow-y:auto; padding:4px}
  .acmenu .acopt{display:flex; align-items:center; gap:9px; padding:9px 11px; font-size:14px; cursor:pointer; border-radius:7px; white-space:nowrap}
  .acmenu .acopt:hover{background:var(--chip)}
  .acmenu .acopt input{width:17px; height:17px; accent-color:var(--brand); flex:0 0 auto}
  .acmenu .acall{border-bottom:1px solid var(--line); font-weight:700; color:var(--brand); border-radius:7px 7px 0 0}
  .months{flex:1; min-width:0; display:flex; gap:8px; overflow-x:auto; padding:10px 0 2px}
  .month-chip{
    flex:0 0 auto; padding:6px 14px; border-radius:999px; font-size:14px;
    background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.35); cursor:pointer;
  }
  .month-chip.sel{background:#fff; color:var(--brand); font-weight:700; border-color:#fff}
  .searchwrap{position:relative; margin-top:8px}
  #destSearch{
    width:100%; padding:11px 40px 11px 14px; font-size:16px; border:0;
    border-radius:10px;
  }
  .searchwrap .icon{position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--muted)}
  #suggest{
    position:absolute; top:calc(100% + 4px); right:0; left:0; z-index:30;
    background:var(--card); color:var(--ink); border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.2); max-height:45dvh; overflow-y:auto;
  }
  #suggest button{
    display:flex; justify-content:space-between; width:100%; padding:11px 14px;
    background:none; border:0; border-bottom:1px solid var(--line);
    font-size:15px; text-align:right; cursor:pointer;
  }
  #suggest button:last-child{border-bottom:0}
  #suggest .cnt{color:var(--muted); font-size:13px}

  main{padding:12px 12px 40px; max-width:640px; margin:0 auto}

  /* הנחות חישוב */
  #assump{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; margin-bottom:12px; font-size:14px;
  }
  #assump summary{cursor:pointer; font-weight:600; color:var(--brand)}
  #assump .row{display:flex; align-items:center; gap:10px; margin-top:10px; flex-wrap:wrap}
  #assump label{color:var(--muted)}
  #assump input[type=number]{
    width:76px; padding:6px 8px; font-size:15px; border:1px solid var(--line); border-radius:8px;
  }
  .depbar{margin-bottom:12px; display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap}
  .depbar .seg{background:var(--card)}
  .acfilter{
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:7px 10px; font-size:14px; color:var(--fg, inherit); max-width:60%;
  }
  /* תצוגת רשימה */
  .listwrap{overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:12px}
  .listtbl{width:100%; border-collapse:collapse; font-size:14px}
  .listtbl th{background:var(--brand); color:#fff; padding:8px 6px; font-weight:600; text-align:center; font-size:12.5px}
  .listtbl th .th-sub{font-weight:400; opacity:.85; font-size:10.5px}
  .listtbl td{padding:8px 6px; border-bottom:1px solid var(--line); text-align:center; white-space:nowrap}
  .listtbl tr:last-child td{border-bottom:0}
  .listtbl tr:nth-child(even) td{background:#f7f9fc}
  .listtbl td.ac{text-align:right; white-space:normal}
  .listtbl td.ac b{display:block}
  .listtbl td.ac .t{color:var(--muted); font-size:12px}
  .listtbl td.code{font-weight:600; color:var(--brand); direction:ltr}
  .listtbl td.price{font-weight:700; color:var(--accent)}
  .listtbl tr.lrow{cursor:pointer}
  .listtbl tr.lrow.open td{background:#eaf0f8}
  .listtbl td.exp{width:26px; color:var(--brand2); font-weight:700}
  .listtbl tr.ldetail td{padding:0; background:#f7f9fc; text-align:right}
  .ldbox{padding:10px 12px}
  .ldbox .minis{margin-bottom:8px}
  .brk-list{border-top:0 !important; padding-top:0 !important}
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
  .seg button{padding:6px 12px; border:0; background:var(--card); font-size:14px; cursor:pointer}
  .seg button.sel{background:var(--brand); color:#fff; font-weight:600}

  /* תצוגת רשימה מורחבת — טבלה (עמודה לכל מטוס) */
  .xwrap{overflow-x:auto; -webkit-overflow-scrolling:touch; background:var(--card); border:1px solid var(--line); border-radius:12px}
  .xtable{border-collapse:separate; border-spacing:0; font-size:13px; min-width:100%}
  .xtable th, .xtable td{padding:8px 11px; border-bottom:1px solid var(--line); white-space:nowrap; text-align:center; direction:ltr; font-variant-numeric:tabular-nums}
  .xtable thead th{position:sticky; top:0; z-index:3; background:var(--brand); color:#fff; font-weight:700; text-align:center}
  .xtable thead th .th-sub{display:block; font-weight:400; font-size:11px; opacity:.85}
  .xtable td.lbl, .xtable th.lbl{position:sticky; right:0; z-index:2; text-align:right; direction:rtl; background:var(--card); font-weight:600; box-shadow:-1px 0 0 var(--line)}
  .xtable thead th.lbl{z-index:4; background:var(--brand)}
  .xtable tbody tr:nth-child(even) td{background:#f7f9fc}
  .xtable tbody tr:nth-child(even) td.lbl{background:#eef3f9}
  .xtable tr.grp td{background:var(--chip); color:var(--brand); font-weight:700; text-align:right; direction:rtl}
  .xtable tr.sum td{font-weight:800; color:var(--brand)}
  .xtable tr.sum2 td{font-weight:700; color:var(--accent)}
  .xtable tr.acmi td{background:#eaf2ff !important; font-weight:800; color:var(--brand2)}
  .xnote{font-size:12px; color:var(--muted); margin:8px 4px 0; text-align:right}

  #status{color:var(--muted); text-align:center; margin:26px 8px; font-size:15px}

  /* כרטיס מטוס */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(14,28,46,.06);
  }
  .card .head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
  .card .ac{font-weight:700; font-size:17px}
  .card .route{
    font-size:13px; color:var(--brand); background:var(--chip);
    border-radius:6px; padding:2px 8px; direction:ltr; white-space:nowrap;
  }
  .card .sub{color:var(--muted); font-size:13px; margin-top:2px}
  .bignums{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0 8px}
  .bignum{background:var(--bg); border-radius:10px; padding:10px 12px}
  .bignum .lbl{font-size:12px; color:var(--muted)}
  .bignum .val{font-size:21px; font-weight:800; color:var(--brand); direction:ltr; text-align:right}
  .bignum.green .val{color:var(--accent)}
  .minis{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; color:var(--muted)}
  .minis b{color:var(--ink); font-weight:600}
  details.brk{margin-top:10px; border-top:1px dashed var(--line); padding-top:8px}
  details.brk summary{cursor:pointer; font-size:14px; color:var(--brand2); font-weight:600}
  .brk table{width:100%; border-collapse:collapse; margin-top:8px; font-size:14px}
  .brk td{padding:5px 2px; border-bottom:1px solid var(--line)}
  .brk td.v{text-align:left; direction:ltr; font-variant-numeric:tabular-nums}
  .brk tr.total td{font-weight:700; border-bottom:0}
  .brk tr.acmi td{font-weight:700; color:var(--brand2); background:#eaf2ff}
  .brk tr.acmi td .sub{color:var(--muted); font-weight:400; font-size:11.5px}
  .note{font-size:12px; color:var(--muted); text-align:center; margin-top:18px}

  /* בורר לשוניות (תמחיר / השפעת מחיר דלק) — בכותרת, מעל שורת החיפוש */
  #tabBar{display:flex; gap:8px; margin-top:9px}
  #tabBar button{flex:1; padding:8px 6px; border:1px solid rgba(255,255,255,.42);
    background:rgba(255,255,255,.16); color:#fff; border-radius:9px;
    font-size:13.5px; font-weight:700; cursor:pointer; white-space:nowrap}
  #tabBar button.sel{background:#fff; color:var(--brand); border-color:#fff}

  /* שדה חיפוש בתוך תפריט רב-ברירה (יעד) */
  .acmenu .acsearch{width:100%; padding:9px 11px; font-size:14px; border:0;
    border-bottom:1px solid var(--line); border-radius:10px 10px 0 0; direction:rtl}
  .acmenu .acsearch:focus{outline:2px solid var(--brand2); outline-offset:-2px}
  /* בוררי הסינון בלשונית הדלק — עוגן לימין וחסימת רוחב כדי שהתפריט לא יברח מהמסך בנייד */
  #fDestMenu, #fAcMenu{right:0; left:auto; min-width:220px; max-width:calc(100vw - 28px)}

  /* לשונית השפעת מחיר דלק — פאנל בקרה */
  .fuelctl{display:flex; flex-direction:column; gap:12px; margin-bottom:12px}
  .fuelctl .frow{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .fuelctl label{color:var(--muted); font-size:14px}
  .fuelctl input[type=number]{width:120px; padding:8px 10px; font-size:15px; border:1px solid var(--line);
    border-radius:8px; direction:ltr; text-align:right}
  .fuelctl .fbasenote{font-size:13px; color:var(--muted)}
  .fuelctl .fbasenote.warn{color:var(--danger)}
  .fuelctl .feff{font-size:15px; font-weight:800; color:var(--brand)}
  .acfilter-body{color:var(--ink) !important; background:var(--card) !important; border:1px solid var(--line) !important}

  /* לשונית השפעת מחיר דלק — טבלה */
  .ftbl{width:100%; border-collapse:collapse; font-size:13px}
  .ftbl thead th{position:sticky; top:0; z-index:2; background:var(--brand); color:#fff; padding:8px 6px;
    font-weight:600; text-align:center; font-size:11.5px}
  .ftbl thead th .th-sub{display:block; font-weight:400; opacity:.85; font-size:10px}
  .ftbl td{padding:7px 6px; border-bottom:1px solid var(--line); text-align:center; white-space:nowrap;
    direction:ltr; font-variant-numeric:tabular-nums}
  .ftbl td.ac{text-align:right; direction:rtl; font-weight:600; white-space:normal}
  .ftbl td.ac .t{display:block; color:var(--muted); font-weight:400; font-size:11px}
  .ftbl tr.grp td{background:var(--chip); color:var(--brand); font-weight:700; text-align:right; direction:rtl}
  .ftbl td.up{color:var(--danger); font-weight:700}
  .ftbl td.down{color:var(--accent); font-weight:700}
  .ftbl td.after{font-weight:800; color:var(--brand)}
  .ftbl tr.ftot td{background:var(--chip); font-weight:800; border-top:2px solid var(--brand)}
  .ftbl tr.ftot td:first-child{text-align:right; direction:rtl}
  .fexport{width:100%; padding:9px 12px; border:1px solid var(--brand); background:#fff; color:var(--brand);
    border-radius:8px; font-weight:700; font-size:14px; cursor:pointer}
  .fexport:active{background:var(--chip)}
  .ftbl .empty{padding:20px 8px; color:var(--muted)}
</style>
</head>
<body>

<!-- מסך נעילה -->
<div id="lock">
  <div class="panel">
    <h1>תמחיר טיסות</h1>
    <p>הזינו שם משתמש וסיסמה</p>
    <input id="usr" type="text" autocomplete="username" inputmode="text" placeholder="שם משתמש" autocapitalize="none" spellcheck="false">
    <input id="pw" type="password" autocomplete="current-password" inputmode="text" placeholder="סיסמה">
    <button id="unlockBtn">כניסה</button>
    <div id="lockErr"></div>
  </div>
</div>

<!-- מסך ראשי -->
<div id="app" class="hidden">
  <header class="app">
    <div class="title">
      <h1>תמחיר טיסות</h1>
      <span class="gen" id="genDate"></span>
      <span class="gen" id="userCount"></span>
      <a class="syslink" href="http://158.178.130.146" target="_blank" rel="noopener">🖥️ מערכת התמחיר ↗</a>
    </div>
    <div class="monthsrow">
      <div class="months" id="months"></div>
      <div class="topctrl hidden" id="topCtrl">
        <span class="seg seg-hdr" id="viewSeg">
          <button data-v="cards" class="sel" title="תצוגת קוביות" aria-label="קוביות"><svg viewBox="0 0 20 20" width="17" height="17" fill="currentColor"><rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5"/></svg></button>
          <button data-v="list" title="תצוגת רשימה" aria-label="רשימה"><svg viewBox="0 0 20 20" width="17" height="17" fill="currentColor"><circle cx="3.5" cy="5" r="1.5"/><rect x="7" y="3.8" width="11" height="2.4" rx="1.2"/><circle cx="3.5" cy="10" r="1.5"/><rect x="7" y="8.8" width="11" height="2.4" rx="1.2"/><circle cx="3.5" cy="15" r="1.5"/><rect x="7" y="13.8" width="11" height="2.4" rx="1.2"/></svg></button>
          <button data-v="xlist" title="רשימה מורחבת (טבלה)" aria-label="טבלה"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.4" y="2.4" width="15.2" height="15.2" rx="2"/><line x1="2.4" y1="7.4" x2="17.6" y2="7.4"/><line x1="2.4" y1="12.5" x2="17.6" y2="12.5"/><line x1="9" y1="2.4" x2="9" y2="17.6"/></svg></button>
        </span>
        <span class="acmulti" id="acMulti">
          <button type="button" id="acBtn" class="acfilter-hdr">כל המטוסים ▾</button>
          <div class="acmenu hidden" id="acMenu"></div>
        </span>
      </div>
    </div>
    <div id="tabBar">
      <button data-t="pricing" class="sel">💺 תמחיר טיסות</button>
      <button data-t="fuel">⛽ השפעת מחיר דלק</button>
    </div>
    <div class="searchwrap">
      <input id="destSearch" type="search" placeholder="חיפוש עיר או קוד IATA… (NEW YORK / JFK)" autocomplete="off">
      <span class="icon">🔎</span>
      <div id="suggest" class="hidden"></div>
    </div>
  </header>

  <main>
    <details id="assump">
      <summary>הנחות חישוב: <span id="assumpSummary"></span></summary>
      <div class="row">
        <span class="seg" id="taxSeg">
          <button data-v="incl" class="sel">כולל מיסי נמל</button>
          <button data-v="ex">ללא מיסי נמל</button>
        </span>
      </div>
      <div class="row">
        <label>שיעור תפוסה %</label>
        <input id="occ" type="number" min="1" max="100" step="1" value="100">
        <label>או כמות נוסעים</label>
        <input id="pax" type="number" min="1" step="1" placeholder="לפי תפוסה">
        <label>עמלת הפצה %</label>
        <input id="fee" type="number" min="0" max="30" step="0.5" value="0">
      </div>
    </details>

    <div class="depbar hidden" id="depBar">
      <span class="seg" id="depSeg">
        <button data-v="all" class="sel">כל ההמראות</button>
        <button data-v="tlv">רק מתל אביב</button>
      </span>
    </div>

    <div id="status">בחרו חודש והקלידו יעד כדי להציג את הנתונים</div>
    <div id="results"></div>

    <!-- לשונית השפעת מחיר דלק -->
    <div id="fuelPanel" class="hidden">
      <div class="fuelctl card">
        <div class="frow">
          <span class="seg" id="fuelModeSeg">
            <button data-v="pct" class="sel">שינוי באחוזים</button>
            <button data-v="price">מחיר דלק חדש</button>
          </span>
        </div>
        <div class="frow" id="fuelPctRow">
          <label>שינוי במחיר הדלק</label>
          <input id="fuelPctInp" type="number" step="1" value="10"> <span>%</span>
        </div>
        <div class="frow hidden" id="fuelPriceRow">
          <span class="seg" id="fuelUnitSeg">
            <button data-v="gal" class="sel">$ לגלון</button>
            <button data-v="ton">$ לטון</button>
          </span>
          <label>מחיר דלק חדש</label>
          <input id="fuelPriceInp" type="number" step="0.01" placeholder="—">
        </div>
        <div class="fbasenote" id="fuelBaseNote"></div>
        <div class="feff" id="fuelEff"></div>
        <div class="frow">
          <span class="seg" id="fDepSeg">
            <button data-v="all" class="sel">כל ההמראות</button>
            <button data-v="tlv">רק מתל אביב</button>
          </span>
        </div>
        <div class="frow">
          <span class="acmulti" id="fDestMulti">
            <button type="button" id="fDestBtn" class="acfilter-hdr acfilter-body">כל היעדים ▾</button>
            <div class="acmenu hidden" id="fDestMenu">
              <input type="search" id="fDestSearch" class="acsearch" placeholder="חיפוש יעד או קוד IATA…" autocomplete="off">
              <div id="fDestOpts"></div>
            </div>

function b64ToBytes(b64){
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

// derive a key from username+password (per-user salt), used to unwrap the master key
async function deriveKey(username, password, salt, usages){
  const km = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(username.toLowerCase() + '\n' + password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: KDF_ITERATIONS, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, usages);
}

async function decrypt(username, password){
  const entry = USERS.find(u => u.u.toLowerCase() === username.toLowerCase().trim());
  if (!entry) throw new Error('bad');
  // 1) unwrap the master key with the user's credentials
  const wrapKey = await deriveKey(username, password, b64ToBytes(entry.s), ['decrypt']);
  const masterRaw = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64ToBytes(entry.iv) }, wrapKey, b64ToBytes(entry.w));
  // 2) decrypt the data with the master key
  const master = await crypto.subtle.importKey('raw', masterRaw, 'AES-GCM', false, ['decrypt']);
  const raw = b64ToBytes(ENC_DATA);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, master, raw.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}

// fire-and-forget login event to the Google Sheet (Apps Script), if configured
function logLogin(username){
  if (!LOG_ENDPOINT) return;
  try {
    fetch(LOG_ENDPOINT, { method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ user: username, ua: navigator.userAgent }) });
  } catch (e) {}
}
// read the login counter via JSONP (Apps Script) and show it
function loadCount(){
  if (!LOG_ENDPOINT) return;
  const cb = 'c' + Date.now();
  window[cb] = res => {
    const el = $('userCount');
    if (el && res) el.textContent = '👤 ' + (res.users != null ? res.users : res.count) + ' משתמשים · ' + (res.logins != null ? res.logins : res.count) + ' כניסות';

  const s = document.createElement('script');
  s.src = LOG_ENDPOINT + (LOG_ENDPOINT.includes('?') ? '&' : '?') + 'action=count&callback=' + cb;
  s.onerror = () => { delete window[cb]; };

}

async function unlock(){
  const usr = $('usr').value.trim();
  const pw = $('pw').value;
  if (!usr || !pw) return;
  if (!(window.crypto && crypto.subtle)) {
    $('lockErr').textContent = 'הדפדפן חוסם פענוח בהקשר זה — יש לפתוח את הקובץ ישירות בדפדפן (Chrome/Safari) או מכתובת https';
    return;
  }
  $('unlockBtn').disabled = true;
  $('lockErr').textContent = '';
  $('unlockBtn').textContent = 'מפענח…';
  try {
    DATA = await decrypt(usr, pw);
    logLogin(usr);
    initApp();
    loadCount();
  } catch (e) {
    $('lockErr').textContent = 'שם משתמש או סיסמה שגויים, נסו שוב';
  } finally {
    $('unlockBtn').disabled = false;
    $('unlockBtn').textContent = 'כניסה';
  }
}

function destsForMonth(){
  // group this month's flights by destination, collecting the IATA codes seen for it
  const map = new Map();
  for (const r of DATA.records) {
    if (r.m !== state.month) continue;
    let e = map.get(r.dest);
    if (!e) { e = { cnt: 0, iatas: new Set() }; map.set(r.dest, e); }
    e.cnt++;
    if (r.iata) e.iatas.add(r.iata);
  }
  return [...map.entries()]
    .map(([dest, e]) => [dest, e.cnt, [...e.iatas].join(' ')])
    .sort((a, b) => a[0].localeCompare(b[0]));
}

function showSuggest(){
  const q = $('destSearch').value.trim().toLowerCase();
  // match either the city name or any IATA code of that destination
  const list = destsForMonth().filter(([d, , iata]) =>

// per-flight occupancy fraction: an explicit passenger count (state.pax) overrides
// the occupancy %, and maps to a different ratio per aircraft (capped at a full plane).
function occFor(r){
  if (state.pax > 0) return Math.min(1, state.pax / r.seats);
  return state.occ / 100;
}
// label for per-passenger lines when the flight is below full capacity
function occNote(c){
  if (c.occ >= 1) return '';
  return state.pax > 0 ? ` (${state.pax} נוסעים)` : ` (תפוסה ${state.occ}%)`;
}
function renderAssumpSummary(){
  $('assumpSummary').textContent =
    (state.tax === 'incl' ? 'כולל מיסי נמל' : 'ללא מיסי נמל') +
    ' · ' + (state.pax > 0 ? state.pax + ' נוסעים' : 'תפוסה ' + state.occ + '%') +
    ' · עמלה ' + state.fee + '%';
}

function hhmm(h){
  if (!h) return '—';
  const m = Math.round(h * 60);
  return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0');
}

// יעד רחוק = טיסה ארוכת-טווח לפי זמן הבלוק (BT ≥ 7 שעות) — זהה לסיווג במנוע.
const FAR_BT_THRESHOLD = 7;
function isFar(r){ return Math.max(r.btOut || 0, r.btBack || 0) >= FAR_BT_THRESHOLD; }
function farDestSet(recs){ return new Set(recs.filter(isFar).map(r => r.dest)); }

function render(){
  const res = $('results');
  res.innerHTML = '';
  if (!state.dest) {
    $('depBar').classList.add('hidden');
    $('topCtrl').classList.add('hidden');
    $('status').textContent = 'בחרו חודש והקלידו יעד כדי להציג את הנתונים';
    return;
  }
  $('depBar').classList.remove('hidden');
  $('topCtrl').classList.remove('hidden');

  const farMode = state.dest === '__FAR__';
  const destLabel = farMode ? 'יעדים רחוקים' : state.dest;
  let all = DATA.records.filter(r => r.m === state.month && (farMode ? isFar(r) : r.dest === state.dest));
  if (state.dep === 'tlv') all = all.filter(r => r.dep === 'TLV');
  // populate the aircraft filter from the aircraft available for this destination
  const acList = [...new Set(all.map(r => r.ac))].sort((a, b) => a.localeCompare(b));
  // drop selections that aren't available for this destination
  state.acSel = state.acSel.filter(a => acList.includes(a));
  renderAcFilter(acList, all.length);

  const rows = state.acSel.length ? all.filter(r => state.acSel.includes(r.ac)) : all.slice();
  const monthLabel = (DATA.months.find(m => m.key === state.month) || {}).label || '';
  if (!rows.length) {
    $('status').textContent = 'אין נתונים ל' + destLabel + ' עם הסינון הנוכחי';
    return;
  }
  const acLbl = state.acSel.length === 1 ? ' · ' + state.acSel[0]
              : state.acSel.length ? ' · ' + state.acSel.length + ' ציים' : '';
  $('status').textContent = destLabel + ' · ' + monthLabel + ' · ' + rows.length +
    (state.dep === 'tlv' ? ' מטוסים מתל אביב' : ' מטוסים') + acLbl + ' (ממוין לפי מחיר למושב)';

  const calc = r => {
    // distribution commission is a share of the selling price → gross up: price = cost / (1 - fee)
    const gross = base => base / (1 - state.fee / 100);
    const occ = occFor(r);
    // per-passenger costs (brk.pax: passenger fees, service, port taxes) are incurred per
    // ACTUAL passenger, so at <100% occupancy the flight's total drops by the empty-seat share.
    const drop = paxDropRaw(r);
    const tot = gross((state.tax === 'incl' ? r.totIncl : r.totEx) - drop);
    const varc = gross((state.tax === 'incl' ? r.varIncl : r.varEx) - drop);
    const fixed = gross(r.fixed);
    const paxSeats = r.seats * occ;
    const b = r.brk;
    return { tot, varc, fixed, perSeat: tot / paxSeats, varPerSeat: varc / paxSeats, fixPerSeat: fixed / paxSeats,
      occ, paxAdj: b.pax * occ, taxIlAdj: b.taxIl * occ, taxAbAdj: b.taxAb * occ,
      // israel/insurance buckets minus their per-passenger portion for the empty seats
      israelAdj: Math.max(0, b.israel - (b.secPax || 0) * (1 - occ)),
      insAdj: Math.max(0, b.ins - (b.insPax || 0) * (1 - occ)) };
  };
  rows.sort((a, b) => calc(a).perSeat - calc(b).perSeat);

  if (state.view === 'list') { renderList(res, rows, calc); return; }
  if (state.view === 'xlist') { renderExpanded(res, rows, calc); return; }

  for (const r of rows) {
    const c = calc(r);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="head">
        <div>
          <div class="ac">${r.ac}</div>
          <div class="sub">${r.acType} · ${r.pilots} טייסים · ${r.att} דיילים${r.dep && r.dep !== 'TLV' ? ' · המראה: ' + r.dep : ''}</div>
        </div>
        <span class="route">${r.route}</span>
      </div>
      <div class="bignums">
        <div class="bignum green">
          <div class="lbl">מחיר למושב (${state.tax === 'incl' ? 'כולל' : 'ללא'} מיסי נמל)</div>
          <div class="val">${fmt.format(c.perSeat)}</div>
        </div>
        <div class="bignum">
          <div class="lbl">עלות טיסה כוללת</div>
          <div class="val">${fmt.format(c.tot)}</div>
        </div>
      </div>
      ${minisHtml(r, c)}
      <details class="brk">
        <summary>פירוט עלויות לטיסה</summary>
        ${breakdownHtml(r, c)}
      </details>`;
    res.appendChild(card);
  }
}

/* מדדים קצרים + פירוט עלויות — משותפים לתצוגת קוביות ורשימה */
// הפחתת העלות הפר-נוסע בגין מושבים ריקים: brk.pax מחושב למלוא הקיבולת, אז ב-תפוסה<100%
// יורדת העלות בגין חלק המושבים הריקים. במצב "ללא מיסי נמל" מנכים גם את מיסי הנמל מ-brk.pax.
function paxDropRaw(r){
  const b = r.brk;
  // brk.pax (fees/service/port-taxes) + the per-passenger portions hidden in israel (security)
  // and insurance — all scale with the actual passenger count.
  const extra = (b.secPax || 0) + (b.insPax || 0);
  const paxFull = (state.tax === 'incl' ? b.pax : (b.pax - b.taxIl - b.taxAb)) + extra;
  return paxFull * (1 - occFor(r));
}
function minisHtml(r, c){
  const fuelPct = r.totIncl ? Math.round(100 * r.brk.fuel / r.totIncl) : 0;
  return `<div class="minis">
    <span>מושבים <b>${r.seats}</b></span>
    <span>זמן טיסה FT <b>${hhmm(r.ftOut)} / ${hhmm(r.ftBack)}</b></span>
    <span>טייסים/דיילים <b>${r.pilots} / ${r.att}</b></span>
    ${r.dep ? `<span>המראה <b>${r.dep}</b></span>` : ''}
    <span>משתנה למושב <b>${fmt.format(c.varPerSeat)}</b></span>
    <span>קבועה למושב <b>${fmt.format(c.fixPerSeat)}</b></span>
    <span>דלק <b>${fuelPct}%</b> מהעלות</span>
  </div>`;
}
function breakdownHtml(r, c){
  const occ = c.occ < 1;
  const secN = occ && (r.brk.secPax || 0) > 0 ? occNote(c) : '';
  const insN = occ && (r.brk.insPax || 0) > 0 ? occNote(c) : '';
  const paxN = occNote(c);
  return `<table>
    <tr><td>שכר וכ"א</td><td class="v">${fmt.format(r.brk.crew)}</td></tr>
    <tr><td>הוצאות בארץ${secN}</td><td class="v">${fmt.format(c.israelAdj)}</td></tr>
    <tr><td>דלק (כולל מס פחמן)</td><td class="v">${fmt.format(r.brk.fuel)}</td></tr>
    <tr><td>ביטוח${insN}</td><td class="v">${fmt.format(c.insAdj)}</td></tr>
    <tr><td>דמי חכירה</td><td class="v">${fmt.format(r.brk.lease)}</td></tr>
    <tr><td>אחזקה</td><td class="v">${fmt.format(r.brk.maint)}</td></tr>
    <tr><td>הוצאות בחו"ל</td><td class="v">${fmt.format(r.brk.abroad)}</td></tr>
    <tr><td>עלויות נוסע${paxN} (כולל מיסי נמל)</td><td class="v">${fmt.format(c.paxAdj)}</td></tr>
    <tr><td class="sub">— מזה מיסי נמל בארץ / בחו"ל</td><td class="v">${fmt.format(c.taxIlAdj)} / ${fmt.format(c.taxAbAdj)}</td></tr>
    <tr><td>סה"כ הוצאות קבועות</td><td class="v">${fmt.format(r.fixed)}</td></tr>
    <tr class="acmi"><td>ACMI <span class="sub">(קבועות+כ"א+אחזקה+ביטוח+חכירה)</span></td><td class="v">${fmt.format(r.fixed + r.brk.crew + r.brk.maint + r.brk.ins + r.brk.lease)}</td></tr>
    <tr class="total"><td>סה"כ עלות טיסה (${state.tax === 'incl' ? 'כולל' : 'ללא'} מיסי נמל${state.fee ? ', כולל עמלה' : ''})</td><td class="v">${fmt.format(c.tot)}</td></tr>
    <tr><td>זמן טיסה BT הלוך/חזור</td><td class="v">${hhmm(r.btOut)} / ${hhmm(r.btBack)}</td></tr>
  </table>`;
}

/* תצוגת רשימה (טבלה) — כל שורה ניתנת להרחבה לפירוט מלא */
function renderList(res, rows, calc){
  const taxLbl = state.tax === 'incl' ? 'כולל מיסים' : 'ללא מיסים';
  let html = '<div class="listwrap"><table class="listtbl"><thead><tr>' +
    '<th>מטוס</th><th>קו</th><th>מושבים</th><th>מחיר/מושב<br><span class="th-sub">(' + taxLbl + ')</span></th><th>עלות טיסה</th><th></th>' +
    '</tr></thead><tbody>';
  rows.forEach((r, i) => {
    const c = calc(r);
    html += `<tr class="lrow" data-i="${i}">
      <td class="ac"><b>${r.ac}</b><span class="t">${r.acType}${r.dep && r.dep !== 'TLV' ? ' · ' + r.dep : ''}</span></td>
      <td class="code">${r.route}</td>
      <td>${r.seats}</td>
      <td class="price">${fmt.format(c.perSeat)}</td>
      <td>${fmt.format(c.tot)}</td>
      <td class="exp">▾</td>
    </tr>
    <tr class="ldetail hidden" data-d="${i}"><td colspan="6"><div class="ldbox">${minisHtml(r, c)}<div class="brk brk-list">${breakdownHtml(r, c)}</div></div></td></tr>`;
  });
  html += '</tbody></table></div>';
  res.innerHTML = html;
  res.querySelectorAll('.lrow').forEach(tr => tr.addEventListener('click', () => {
    const d = res.querySelector('.ldetail[data-d="' + tr.dataset.i + '"]');
    const nowHidden = d.classList.toggle('hidden');
    tr.querySelector('.exp').textContent = nowHidden ? '▾' : '▴';
    tr.classList.toggle('open', !nowHidden);
  }));
}

/* תצוגת רשימה מורחבת — טבלה אחת: שורות=נתונים, עמודות=מטוסים (כל הטיסות בבת אחת) */
function renderExpanded(res, rows, calc){
  const taxLbl = state.tax === 'incl' ? 'כולל מיסי נמל' : 'ללא מיסי נמל';
  const feeLbl = state.fee ? ', כולל עמלה' : '';
  const items = rows.map(r => ({ r, c: calc(r) }));
  const empties = items.map(() => '<td></td>').join('');
  const money = v => fmt.format(v);
  const row = (label, fn, cls) =>
    `<tr class="${cls || ''}"><td class="lbl">${label}</td>` +
    items.map(({ r, c }) => `<td class="v">${fn(r, c)}</td>`).join('') + '</tr>';
  const grp = label => `<tr class="grp"><td class="lbl">${label}</td>${empties}</tr>`;

  let html = '<div class="xwrap"><table class="xtable"><thead><tr><th class="lbl">מטוס</th>' +
    items.map(({ r }) => `<th>${r.ac}<span class="th-sub">${r.route}${r.dep && r.dep !== 'TLV' ? ' · ' + r.dep : ''}</span></th>`).join('') +
    '</tr></thead><tbody>';

  html += grp('🛫 נתונים תפעוליים');
  html += row('שעות לסבב BT', r => hhmm((r.btOut || 0) + (r.btBack || 0)));
  html += row('צריכת דלק לסבב', r => r.fuelKg ? fmt.format(r.fuelKg) + ' ק"ג' : '—');
  html += row('כמות טייסים', r => r.pilots);
  html += row('כמות דיילים', r => r.att);
  html += row('מושבים למכירה', r => r.seats);
  html += row('— מזה ביזנס', r => r.seatsBiz != null ? r.seatsBiz : '—');

  const occLbl = state.pax > 0 ? state.pax + ' נוסעים' : (state.occ < 100 ? 'תפוסה ' + state.occ + '%' : '');
  const occN = occLbl ? ` (${occLbl})` : '';
  html += grp(`💰 נתונים כספיים (${taxLbl}${feeLbl}${occLbl ? ', ' + occLbl : ''})`);
  html += row('עלות דלק', r => money(r.brk.fuel));
  html += row('עלות כוח אדם', r => money(r.brk.crew));
  html += row('אחזקה', r => money(r.brk.maint));
  html += row('הוצאות בארץ', (r, c) => money(c.israelAdj));
  html += row('ביטוח', (r, c) => money(c.insAdj));
  html += row('דמי חכירה', r => money(r.brk.lease));
  html += row('הוצאות בחו"ל', r => money(r.brk.abroad));
  html += row('עלויות נוסע' + occN, (r, c) => money(c.paxAdj));
  html += row('הוצאות קבועות', r => money(r.fixed));
  html += row('ACMI *', r => money(r.fixed + r.brk.crew + r.brk.maint + r.brk.ins + r.brk.lease), 'acmi');
  html += row('סה"כ עלות טיסה — משתנות', (r, c) => money(c.varc), 'sum');
  html += row('סה"כ עלות טיסה — כולל קבועות', (r, c) => money(c.tot), 'sum');
  html += row('עלות למושב — כולל קבועות', (r, c) => money(c.perSeat), 'sum2');
  html += row('עלות למושב — משתנות', (r, c) => money(c.varPerSeat), 'sum2');

  html += '</tbody></table></div>';
  html += '<div class="xnote">* ACMI = עלויות קבועות + כוח אדם + אחזקה + ביטוח + דמי חכירה</div>';
  res.innerHTML = html;
}

/* ── לשוניות: תמחיר / השפעת מחיר דלק ── */
function refresh(){ if (state.tab === 'fuel') renderFuel(); else render(); }

function switchTab(t){
  state.tab = t;
  for (const b of $('tabBar').children) b.classList.toggle('sel', b.dataset.t === t);
  const fuel = t === 'fuel';
  $('fuelPanel').classList.toggle('hidden', !fuel);
  // אלמנטים ששייכים רק ללשונית התמחיר
  $('results').classList.toggle('hidden', fuel);
  $('status').classList.toggle('hidden', fuel);
  $('depBar').classList.toggle('hidden', fuel);
  $('topCtrl').classList.toggle('hidden', fuel);
  document.querySelector('.searchwrap').classList.toggle('hidden', fuel);
  refresh();
}
$('tabBar').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) switchTab(b.dataset.t);
});

/* ── השפעת מחיר דלק: חישוב ── */
// המרת גלון→טון לג'ט-פ"ט: 1 טון מטרי ≈ 311 גלון (צפיפות ~0.85). מחושב מהמחיר
// לגלון (מקור האמת), ולא מ-tlvUsdTon שבשרת.
const GAL_PER_TON = 311;
function fuelBaseFor(unit){
  const f = DATA && DATA.fuel;
  if (!f || f.tlvUsdGal == null) return null;
  return unit === 'ton' ? f.tlvUsdGal * GAL_PER_TON : f.tlvUsdGal;
}
// שיעור השינוי במחיר הדלק כשבר עשרוני (חתום). במצב 'מחיר' — מול מחיר נתב"ג הנוכחי.
function getFuelPct(){
  if (state.fuelMode === 'pct') return (+state.fuelPct || 0) / 100;
  const base = fuelBaseFor(state.fuelUnit);
  if (!base || state.fuelPrice == null) return 0;
  return (+state.fuelPrice - base) / base;
}
// מחיר הדלק צומח ליניארית עם עלות הדלק (כולל מס פחמן), לכן הפקטור מוכפל בכל עלות הדלק.
function fuelCalc(r, pct){
  const gross = base => base / (1 - state.fee / 100);   // עמלת הפצה = נגזרת ממחיר המכירה
  const paxSeats = r.seats * occFor(r);
  const drop = paxDropRaw(r);   // העלות הפר-נוסע יורדת עם התפוסה
  const rawVar = (state.tax === 'incl' ? r.varIncl : r.varEx) - drop;
  const rawTot = (state.tax === 'incl' ? r.totIncl : r.totEx) - drop;
  const rawFuel = r.brk.fuel;
  const varc = gross(rawVar);
  const fuelNow = gross(rawFuel);                        // עלות דלק לפני השינוי
  const impact = fuelNow * pct;                          // השפעת השינוי (חתום) = ההפרש
  const fuelAfter = fuelNow + impact;                    // עלות דלק לאחר השינוי
  const totalBefore = gross(rawTot);                     // סה"כ עלויות טיסה לפני השינוי
  const totalAfter = gross(rawTot + rawFuel * pct);      // סה"כ עלויות טיסה לאחר השינוי
  const perSeatNow = totalBefore / paxSeats;
  const perSeatAfter = totalAfter / paxSeats;
  return { varc, fuelNow, fuelAfter, impact, totalBefore, totalAfter, perSeatNow, perSeatAfter };
}

function fmtPrice(v){ return state.fuelUnit === 'ton' ? fmt.format(v) : (Math.round(v * 100) / 100).toFixed(2); }

function renderFuelInputs(){
  const priceMode = state.fuelMode === 'price';
  $('fuelPctRow').classList.toggle('hidden', priceMode);
  $('fuelPriceRow').classList.toggle('hidden', !priceMode);
  for (const b of $('fuelModeSeg').children) b.classList.toggle('sel', b.dataset.v === state.fuelMode);
  for (const b of $('fuelUnitSeg').children) b.classList.toggle('sel', b.dataset.v === state.fuelUnit);
  for (const b of $('fDepSeg').children) b.classList.toggle('sel', b.dataset.v === state.fuelDep);
  const note = $('fuelBaseNote');
  const base = fuelBaseFor(state.fuelUnit);
  const unitLbl = state.fuelUnit === 'ton' ? 'טון' : 'גלון';
  note.classList.remove('warn');
  if (priceMode){
    if (base == null){
      note.classList.add('warn');
      note.textContent = 'מחיר הדלק הנוכחי בנתב"ג אינו זמין בגרסת הנתונים הזו — השתמשו בשינוי באחוזים';
    } else {
      note.textContent = 'מחיר נוכחי בנתב"ג: $' + fmtPrice(base) + ' / ' + unitLbl;
      if (state.fuelPrice == null){ state.fuelPrice = base; $('fuelPriceInp').value = fmtPrice(base); }
    }
  } else {
    note.textContent = '';
  }
  const p = getFuelPct() * 100;
  $('fuelEff').textContent = 'שינוי אפקטיבי במחיר הדלק: ' + (p > 0 ? '+' : '') + fmt1.format(p) + '%';
}

// יעדים: רשימת צ'ק-בוקסים מסוננת לפי מה שהוקלד בשדה החיפוש (fDestQuery).
// מרונדר בנפרד כדי לא לבנות מחדש את שדה החיפוש עצמו (שמירת פוקוס בזמן הקלדה).
function renderFDestOpts(){
  const esc = s => String(s).replace(/"/g, '&quot;');
  const q = (state.fDestQuery || '').trim().toLowerCase();
  // match by destination name OR by any of its IATA codes
  const list = fuelAllDests.filter(d => !q ||
    d.toLowerCase().includes(q) || (fuelDestIata[d] || '').toLowerCase().includes(q));
  const farN = [...fuelFarDests].filter(d => fuelAllDests.includes(d)).length;
  const allOpt = q ? '' :
    '<label class="acopt acall"><input type="checkbox" id="fDestAll" ' + (state.fuelDestSel.length ? '' : 'checked') + '> כל היעדים (' + fuelAllDests.length + ')</label>' +
    (farN ? '<label class="acopt acall"><input type="checkbox" id="fDestFar"> 🌍 יעדים רחוקים (' + farN + ')</label>' : '');
  const optHtml = d => {
    const iata = fuelDestIata[d];
    const code = iata ? ' <span style="color:var(--muted)">· ' + iata + '</span>' : '';
    return '<label class="acopt"><input type="checkbox" value="' + esc(d) + '" ' + (state.fuelDestSel.includes(d) ? 'checked' : '') + '> ' + d + code + '</label>';
  };
  $('fDestOpts').innerHTML = allOpt + (list.length
    ? list.map(optHtml).join('')
    : '<div class="acopt" style="color:var(--muted)">אין יעד תואם</div>');
}

function renderFuelFilters(dests, acs){
  const esc = s => String(s).replace(/"/g, '&quot;');
  fuelAllDests = dests;
  $('fDestBtn').textContent = (state.fuelDestSel.length ? state.fuelDestSel.length + ' יעדים' : 'כל היעדים') + ' ▾';
  $('fAcBtn').textContent = (state.fuelAcSel.length ? state.fuelAcSel.length + ' מטוסים' : 'כל המטוסים') + ' ▾';
  renderFDestOpts();
  $('fAcMenu').innerHTML =
    '<label class="acopt acall"><input type="checkbox" id="fAcAll" ' + (state.fuelAcSel.length ? '' : 'checked') + '> כל המטוסים (' + acs.length + ')</label>' +
    acs.map(a => '<label class="acopt"><input type="checkbox" value="' + esc(a) + '" ' + (state.fuelAcSel.includes(a) ? 'checked' : '') + '> ' + a + '</label>').join('');
}

function renderFuel(){
  const monthRecs = DATA.records.filter(r => r.m === state.month);
  const allDests = [...new Set(monthRecs.map(r => r.dest))].sort((a, b) => a.localeCompare(b));
  const allAcs = [...new Set(monthRecs.map(r => r.ac))].sort((a, b) => a.localeCompare(b));
  // collect the IATA codes seen per destination this month (for search + display)
  const iataSets = {};
  for (const r of monthRecs){ if (r.iata){ (iataSets[r.dest] || (iataSets[r.dest] = new Set())).add(r.iata); } }
  fuelDestIata = {};
  for (const d in iataSets) fuelDestIata[d] = [...iataSets[d]].join(' ');
  fuelFarDests = farDestSet(monthRecs);
  state.fuelDestSel = state.fuelDestSel.filter(d => allDests.includes(d));
  state.fuelAcSel = state.fuelAcSel.filter(a => allAcs.includes(a));
  renderFuelInputs();
  renderFuelFilters(allDests, allAcs);

  const pct = getFuelPct();
  let rows = monthRecs;
  if (state.fuelDep === 'tlv') rows = rows.filter(r => r.dep === 'TLV');
  if (state.fuelDestSel.length) rows = rows.filter(r => state.fuelDestSel.includes(r.dest));
  if (state.fuelAcSel.length) rows = rows.filter(r => state.fuelAcSel.includes(r.ac));

  const byDest = new Map();
  for (const r of rows){ if (!byDest.has(r.dest)) byDest.set(r.dest, []); byDest.get(r.dest).push(r); }
  const dests = [...byDest.keys()].sort((a, b) => a.localeCompare(b));

  const money = v => fmt.format(v);
  const signed = v => (v > 0 ? '+' : '') + fmt.format(v);
  let html = '<table class="ftbl"><thead><tr>' +
    '<th>מטוס</th>' +
    '<th>דלק<span class="th-sub">ק"ג</span></th>' +
    '<th>עלות דלק<span class="th-sub">לפני</span></th>' +
    '<th>עלות דלק<span class="th-sub">אחרי</span></th>' +
    '<th>סה"כ עלויות<span class="th-sub">לפני</span></th>' +
    '<th>סה"כ עלויות<span class="th-sub">אחרי</span></th>' +
    '<th>הפרש</th>' +
    '</tr></thead><tbody>';
  if (!dests.length){
    html += '<tr><td colspan="7" class="empty">אין נתונים לחודש/סינון הנוכחי</td></tr>';
  }
  const T = { kg: 0, fb: 0, fa: 0, tb: 0, ta: 0, d: 0, n: 0 };
  fuelExportRows = []; fuelExportPct = pct;
  for (const d of dests){
    const list = byDest.get(d).map(r => ({ r, c: fuelCalc(r, pct) }));
    list.sort((a, b) => b.c.totalAfter - a.c.totalAfter);
    const iata = byDest.get(d)[0].iata;
    html += '<tr class="grp"><td colspan="7">' + d + (iata ? ' · ' + iata : '') + '</td></tr>';
    for (const { r, c } of list){
      const cls = c.impact > 0 ? 'up' : (c.impact < 0 ? 'down' : '');
      const kg = r.fuelKg || 0;
      fuelExportRows.push({ dest: d, iata, r, c });
      T.kg += kg; T.fb += c.fuelNow; T.fa += c.fuelAfter; T.tb += c.totalBefore; T.ta += c.totalAfter; T.d += c.impact; T.n++;
      html += '<tr>' +
        '<td class="ac">' + r.ac + '<span class="t">' + r.route + (r.dep && r.dep !== 'TLV' ? ' · ' + r.dep : '') + '</span></td>' +
        '<td>' + money(kg) + '</td>' +
        '<td>' + money(c.fuelNow) + '</td>' +
        '<td class="after">' + money(c.fuelAfter) + '</td>' +
        '<td>' + money(c.totalBefore) + '</td>' +
        '<td class="after">' + money(c.totalAfter) + '</td>' +
        '<td class="' + cls + '">' + signed(c.impact) + '</td>' +
        '</tr>';
    }
  }
  if (dests.length){
    const dcls = T.d > 0 ? 'up' : (T.d < 0 ? 'down' : '');
    html += '<tr class="ftot"><td>סה"כ · ' + T.n + ' טיסות</td>' +
      '<td>' + money(T.kg) + '</td>' +
      '<td>' + money(T.fb) + '</td>' +
      '<td>' + money(T.fa) + '</td>' +
      '<td>' + money(T.tb) + '</td>' +
      '<td>' + money(T.ta) + '</td>' +
      '<td class="' + dcls + '">' + signed(T.d) + '</td></tr>';
  }
  html += '</tbody></table>';
  $('fuelTable').innerHTML = html;
}

/* ── ייצוא לאקסל (CSV עם BOM, נפתח ישירות באקסל) ── */
function csvCell(v){
  const s = String(v == null ? '' : v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportFuelCsv(){
  if (!fuelExportRows.length){ alert('אין נתונים לייצוא לפי הסינון הנוכחי'); return; }
  const monthLabel = (DATA.months.find(m => m.key === state.month) || {}).label || String(state.month);
  const effPct = fuelExportPct * 100;
  const title = 'השפעת שינוי מחיר דלק · ' + monthLabel +
    ' · שינוי דלק ' + (effPct > 0 ? '+' : '') + fmt1.format(effPct) + '%' +
    ' · ' + (state.tax === 'incl' ? 'כולל מיסי נמל' : 'ללא מיסי נמל') +
    ' · ' + (state.pax > 0 ? state.pax + ' נוסעים' : 'תפוסה ' + state.occ + '%') +
    ' · עמלה ' + state.fee + '%' +
    (state.fuelDep === 'tlv' ? ' · רק מתל אביב' : '');
  const headers = ['יעד', 'קוד', 'מטוס', 'קו', 'המראה', 'דלק (ק"ג)',
    'עלות דלק לפני', 'עלות דלק אחרי', 'סה"כ עלויות לפני', 'סה"כ עלויות אחרי', 'הפרש'];
  const R = v => Math.round(v || 0);
  const lines = [[title], [], headers];
  const T = { kg: 0, fb: 0, fa: 0, tb: 0, ta: 0, d: 0 };
  for (const { dest, iata, r, c } of fuelExportRows){
    lines.push([dest, iata || '', r.ac, r.route, r.dep || '', R(r.fuelKg),
      R(c.fuelNow), R(c.fuelAfter), R(c.totalBefore), R(c.totalAfter), R(c.impact)]);
    T.kg += r.fuelKg || 0; T.fb += c.fuelNow; T.fa += c.fuelAfter; T.tb += c.totalBefore; T.ta += c.totalAfter; T.d += c.impact;
  }
  lines.push(['סה"כ', '', '', '', '', R(T.kg), R(T.fb), R(T.fa), R(T.tb), R(T.ta), R(T.d)]);
  const csv = '﻿' + lines.map(row => row.map(csvCell).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'השפעת_דלק_' + String(monthLabel).replace(/\s+/g, '_') + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

/* אירועי לשונית הדלק */
$('fuelExportBtn').addEventListener('click', exportFuelCsv);
$('fuelModeSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.fuelMode = b.dataset.v; renderFuel();
});
$('fDepSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.fuelDep = b.dataset.v; renderFuel();
});
$('fuelUnitSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (state.fuelUnit !== b.dataset.v){ state.fuelUnit = b.dataset.v; state.fuelPrice = null; }  // רענון מחיר לפי היחידה
  renderFuel();
});
$('fuelPctInp').addEventListener('input', () => { state.fuelPct = +$('fuelPctInp').value || 0; renderFuel(); });
$('fuelPriceInp').addEventListener('input', () => {
  state.fuelPrice = $('fuelPriceInp').value === '' ? null : (+$('fuelPriceInp').value);
  renderFuel();
});
$('fDestBtn').addEventListener('click', e => {
  e.stopPropagation();
  const nowHidden = $('fDestMenu').classList.toggle('hidden');
  $('fAcMenu').classList.add('hidden');
  if (!nowHidden) setTimeout(() => $('fDestSearch').focus(), 0);   // מיקוד לשדה ההקלדה בפתיחה
});
$('fAcBtn').addEventListener('click', e => { e.stopPropagation(); $('fAcMenu').classList.toggle('hidden'); $('fDestMenu').classList.add('hidden'); });
$('fDestMenu').addEventListener('click', e => e.stopPropagation());
$('fAcMenu').addEventListener('click', e => e.stopPropagation());
$('fDestSearch').addEventListener('input', () => { state.fDestQuery = $('fDestSearch').value; renderFDestOpts(); });
$('fDestMenu').addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fDestSearch') return;   // שדה החיפוש — לא בחירת יעד
  if (t.id === 'fDestAll'){ state.fuelDestSel = []; }
  else if (t.id === 'fDestFar'){ state.fuelDestSel = [...fuelFarDests].filter(d => fuelAllDests.includes(d)); }
  else if (t.value){ if (t.checked){ if (!state.fuelDestSel.includes(t.value)) state.fuelDestSel.push(t.value); } else { state.fuelDestSel = state.fuelDestSel.filter(x => x !== t.value); } }
  renderFuel();
});
$('fAcMenu').addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fAcAll'){ state.fuelAcSel = []; }
  else if (t.value){ if (t.checked){ if (!state.fuelAcSel.includes(t.value)) state.fuelAcSel.push(t.value); } else { state.fuelAcSel = state.fuelAcSel.filter(x => x !== t.value); } }
  renderFuel();
});
document.addEventListener('click', () => { $('fDestMenu').classList.add('hidden'); $('fAcMenu').classList.add('hidden'); });

/* ── ניתוק אוטומטי לאחר שעה ללא פעילות ── */
const IDLE_MS = 60 * 60 * 1000;
let idleTimer = null;
function resetIdle(){
  if (!DATA) return;                 // only while unlocked
  clearTimeout(idleTimer);
  idleTimer = setTimeout(autoLock, IDLE_MS);
}
function autoLock(){
  DATA = null;
  clearTimeout(idleTimer);
  state = { month: null, dest: null, dep: 'all', acSel: [], view: state.view, tax: 'incl', occ: 100, pax: null, fee: 0,
    tab: 'pricing', fuelMode: 'pct', fuelUnit: 'gal', fuelPct: 10, fuelPrice: null, fuelDestSel: [], fuelAcSel: [], fDestQuery: '', fuelDep: 'all' };
  $('results').innerHTML = '';
  $('fuelTable').innerHTML = '';
  $('destSearch').value = '';
  $('fDestSearch').value = '';
  $('status').textContent = 'בחרו חודש והקלידו יעד כדי להציג את הנתונים';
  $('app').classList.add('hidden');
  $('lock').classList.remove('hidden');
  $('pw').value = '';
  $('lockErr').textContent = 'ננעל אוטומטית לאחר שעה ללא פעילות — יש להיכנס מחדש';
  $('pw').focus();
}
['mousemove','mousedown','keydown','scroll','touchstart','click'].forEach(function(ev){
  document.addEventListener(ev, resetIdle, { passive: true });
});
