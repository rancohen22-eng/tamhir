name: Daily Fuel Price Email

on:
  # ההפצה האוטומטית היומית הושבתה (אין מקור חוזים חינמי ויציב).
  # להחזרה: החזירו את בלוק ה-schedule עם cron '0 5 * * *'.
  # כרגע ניתן להריץ ידנית בלבד מלשונית Actions (הקוד נשמר במלואו).
  workflow_dispatch: {}

# מונע ריצות חופפות אם הרצה ידנית מתנגשת עם המתוזמנת
concurrency:
  group: daily-fuel-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build fuel report
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          BARCHART_API_KEY: ${{ secrets.BARCHART_API_KEY }}
        run: node scripts/fuel-report.mjs

      # שליחת מייל רק בריצה מתוזמנת או ידנית — לא בריצת push (שהיא בנייה/אימות בלבד).
      - name: Send email
        if: github.event_name != 'push'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          from: Fuel Report <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: file://out/subject.txt
          html_body: file://out/email.html
